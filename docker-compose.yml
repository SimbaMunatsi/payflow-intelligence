services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: payflow-api

    ports:
      - "8000:8000"

    volumes:
      # Development only
      # Allows live code changes without rebuilding the image
      - .:/app

    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    container_name: payflow-ui

    depends_on:
      - api

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000

    volumes:
      # Development only
      - .:/app

    restart: unless-stopped